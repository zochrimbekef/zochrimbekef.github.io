<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE8FF">
<title>זוכרים בכיף · דמו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#BDE8FF;--sky2:#E8F7FF;--g1:#8CD98C;--g2:#5DBB63;
  --ink:#1C3A1E;--ink2:#35553A;--ink3:#5E7F62;--blue:#164A6B;
  --soft:#F1FAEF;--line:#D4EBD3;--leaf:#2E7D32;--sun:#FFC93C;--water:#2E9BE6;--bad:#E05252;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:Rubik,system-ui,sans-serif;font-size:17px;line-height:1.5;color:var(--ink);background:#DDEFD9;min-height:100vh;min-height:100dvh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;font-size:16px}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 220px,#F6FCF4 440px)}
.demo{position:sticky;top:0;z-index:30;text-align:center;font-size:13px;font-weight:700;color:#5a4a10;background:#FFF1B8;padding:4px 8px;padding-top:calc(4px + env(safe-area-inset-top))}
.scr{padding:14px 16px 120px;animation:scr .45s var(--ease) both}
@keyframes scr{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{width:44px;height:44px;border-radius:14px;background:#ffffffcc;font-size:22px;display:grid;place-items:center;flex:none}
.top h1{font-size:21px;font-weight:800;color:var(--blue);flex:1;min-width:0}
.top .tm{font-size:14px;color:var(--ink3);background:#ffffffcc;border-radius:99px;padding:3px 10px;flex:none}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 22px #2E7D3214;margin:12px 0}
.muted{color:var(--ink3);font-size:15px}
.big{font-size:20px;font-weight:700}
.btn{display:block;width:100%;border-radius:18px;padding:14px;font-size:18px;font-weight:800;background:var(--leaf);color:#fff;box-shadow:0 5px 0 #1B5E20;transition:transform .15s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1B5E20}
.btn.y{background:var(--sun);color:#3b2a00;box-shadow:0 5px 0 #C9921A}
.btn.b{background:var(--water);box-shadow:0 5px 0 #1C6FA8}
.btn.g{background:#E6F2E4;color:var(--ink);box-shadow:0 5px 0 #C5DCC2}
.btn+.btn{margin-top:12px}
.row2{display:flex;gap:10px}.row2 .btn{margin:0}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px);opacity:0;z-index:60;
  background:#164A6B;color:#fff;border-radius:16px;padding:10px 16px;font-size:15px;max-width:calc(100vw - 32px);width:max-content;text-align:center;transition:.35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- home / garden ---------- */
.sun{position:absolute;top:44px;left:22px;width:54px;height:54px;border-radius:50%;background:radial-gradient(#FFF6A8,var(--sun));box-shadow:0 0 40px var(--sun);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hi{font-size:24px;font-weight:800;color:var(--blue);margin-top:4px}
.streak{display:inline-flex;align-items:center;gap:6px;background:#ffffffd0;border-radius:99px;padding:4px 12px;font-size:15px;font-weight:700;margin-top:6px}
.streak .f{display:inline-block;animation:flick 1.4s ease-in-out infinite;transform-origin:bottom}
@keyframes flick{50%{transform:scale(1.15) rotate(-4deg)}}
.garden{position:relative;display:flex;justify-content:space-around;align-items:flex-end;height:170px;margin:12px -16px 0;padding:0 8px;
  background:linear-gradient(180deg,transparent 70%,var(--g1) 70%,var(--g2))}
.pl{position:relative;text-align:center;font-size:13px;font-weight:700;color:#fff;padding-bottom:8px;width:30%}
.pl .p{display:block;line-height:1;transform-origin:bottom;transition:font-size .9s var(--ease);animation:sway 4s ease-in-out infinite}
.pl:nth-child(2) .p{animation-delay:-1.3s}.pl:nth-child(3) .p{animation-delay:-2.6s}
@keyframes sway{50%{transform:rotate(-3deg)}}
.pl .drops{position:absolute;inset:-70px 0 auto;height:80px;pointer-events:none}
.pl .drops i{position:absolute;top:0;font-style:normal;font-size:18px;animation:drop 1s ease-in both}
@keyframes drop{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(70px);opacity:0}}
.tasks{background:#fff;border-radius:26px 26px 0 0;margin:0 -16px;padding:16px 16px 6px;min-height:200px}
.tk{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px;border-radius:16px;margin:8px 0;background:var(--soft);transition:transform .15s}
.tk:active{transform:scale(.98)}
.tk .e{font-size:28px;width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.tk .w{flex:1;min-width:0}.tk .w b{display:block;font-size:17px}.tk small{color:var(--ink3);font-size:14px}
.tk .st{font-size:20px;flex:none}
.tk.done{background:#E3F6E1}
.helpbtn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;
  background:#1F2328;color:#fff;border-radius:99px;padding:12px 22px;font-size:17px;font-weight:700;box-shadow:0 10px 30px #0004;white-space:nowrap}
.helpbtn .mi{font-size:22px}
.seedsum{display:flex;gap:8px;margin-top:8px}
.seedsum div{flex:1;background:var(--soft);border-radius:14px;padding:8px;text-align:center;font-size:13px;color:var(--ink3)}
.seedsum b{display:block;font-size:20px;color:var(--leaf)}

/* ---------- ex1 ---------- */
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0}
.wave{display:flex;gap:5px;align-items:center;height:50px}
.wave i{width:7px;border-radius:9px;background:var(--water);height:12px}
.wave.on i{animation:wv .8s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{to{height:46px}}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:58px;height:58px;border-radius:16px;border:2px dashed #B9D8B6;display:grid;place-items:center;font-size:30px;background:#fff;position:relative}
.slot .n{position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--sun);font-size:12px;font-weight:700;display:grid;place-items:center}
.slot.ok{border:2px solid var(--leaf);background:#E3F6E1}.slot.bad{border:2px solid var(--bad);background:#FDECEC}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.ic{aspect-ratio:1;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;transition:transform .15s,opacity .2s;border:2px solid transparent}
.ic small{font-size:11px;line-height:1.2;color:var(--ink3);margin-top:2px;text-align:center;padding:0 2px;overflow-wrap:anywhere}
.ic:active{transform:scale(.94)}
.ic.used{opacity:.3}
.answer{margin-top:10px;font-size:15px;background:var(--soft);border-radius:14px;padding:10px}

/* ---------- ex2 ---------- */
.target{text-align:center}
.target .tw{display:inline-block;font-size:26px;font-weight:800;color:var(--leaf);background:#E3F6E1;border-radius:14px;padding:4px 16px;margin-top:4px}
.stage{height:130px;display:grid;place-items:center;background:#fff;border-radius:22px;margin:14px 0;box-shadow:inset 0 0 0 2px var(--line)}
.stage .word{font-size:34px;font-weight:800;color:var(--blue)}
.stage.flash{box-shadow:inset 0 0 0 4px var(--leaf)}
.stage.miss{box-shadow:inset 0 0 0 4px var(--bad)}
.hunt{height:110px;border-radius:26px;font-size:24px}
.prog{height:8px;border-radius:99px;background:#E6F2E4;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--sun));transition:width .4s}

/* ---------- ex3 ---------- */
.seg{display:flex;background:#ffffffcc;border-radius:16px;padding:4px;gap:4px;margin-bottom:8px}
.seg button{flex:1;border-radius:12px;padding:9px;font-weight:700;font-size:16px;color:var(--ink3)}
.seg button.on{background:#fff;color:var(--leaf);box-shadow:0 2px 8px #0001}
.wcard{background:#fff;border-radius:26px;padding:22px 16px;text-align:center;box-shadow:0 10px 30px #2E7D321f;margin-top:10px}
.wcard .pic{font-size:84px;line-height:1.1;animation:float 3.5s ease-in-out infinite}
.wcard .en{font-size:36px;font-weight:800;color:var(--leaf);direction:ltr}
.wcard .he{font-size:22px}
.wcard .story{margin-top:10px;color:var(--ink2);background:#FFF8DC;border-radius:14px;padding:10px;font-size:16px}
.sched{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.sched span{font-size:13px;background:var(--soft);border-radius:99px;padding:3px 10px;color:var(--ink3)}
.sched span.now{background:#D9EEFC;color:#164A6B;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.choices button{aspect-ratio:1;border-radius:18px;background:var(--soft);font-size:40px;border:2px solid transparent}
.choices button.ok{border-color:var(--leaf);background:#E3F6E1}.choices button.bad{border-color:var(--bad);background:#FDECEC}
.field{display:block;margin-top:10px}
.field span{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.field input,.field textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--leaf)}
.emo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emo button{aspect-ratio:1;border-radius:12px;background:var(--soft);font-size:24px;border:2px solid transparent}
.emo button.on{border-color:var(--leaf);background:#E3F6E1}
.lyr .line{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;margin:8px 0;border-radius:14px;background:#fff;border-inline-start:6px solid var(--c)}
.lyr .line button{min-width:40px;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:18px;font-weight:700;color:var(--c2)}
.lyr .line button.show{background:#FFF1B8;color:var(--ink)}

/* ---------- helper (clean & calm) ---------- */
.calm{background:#F6F4EF;min-height:100vh;min-height:100dvh;font-family:"Varela Round",Rubik,sans-serif;color:#1F2328}
.calm .top h1{color:#1F2328}
.calm .back{background:#fff}
.notice{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px;font-size:15px;color:#5B616B;box-shadow:0 1px 2px #0000000d}
.notice button{color:#1F2328;text-decoration:underline;font-size:14px;margin-top:4px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:26px 0 10px}
.mic{width:120px;height:120px;border-radius:50%;background:#1F2328;color:#fff;font-size:48px;display:grid;place-items:center;box-shadow:0 12px 36px #0003;position:relative}
.mic.on{background:#D93B3B}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #D93B3B;animation:ring 1.8s ease-out infinite}
.mic.on::after{animation-delay:.9s}
@keyframes ring{to{transform:scale(1.6);opacity:0}}
.live{background:#fff;border-radius:16px;padding:12px;min-height:90px;font-size:16px;color:#3A3F47;line-height:1.6}
.live .int{color:#9AA0A8}
.hcard{background:#fff;border-radius:22px;padding:14px;box-shadow:0 1px 2px #0000000d,0 8px 26px #0000000f;margin-top:12px}
.hcard .t{font-size:19px;font-weight:700;margin-bottom:4px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0EEE9}
.hrow:last-of-type{border-bottom:0}
.hrow .i{width:40px;height:40px;border-radius:12px;background:#F1EFEA;display:grid;place-items:center;font-size:20px;flex:none}
.hrow .w{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.hrow .w input{width:100%;border:2px solid #D7D9DE;border-radius:10px;padding:6px 8px;background:#FAFAF8}
.hrow .to{font-size:13px;padding:5px 10px;border-radius:99px;background:#F1EFEA;color:#3A3F47;white-space:nowrap;flex:none}
.hrow .x{font-size:16px;color:#9AA0A8;width:30px;height:30px;flex:none}
.gone{font-size:14px;color:#5B616B;background:#EEF6EC;border-radius:12px;padding:8px 10px;margin-top:10px}
.cbtn{display:block;width:100%;border-radius:16px;padding:13px;font-size:17px;font-weight:700;background:#1F2328;color:#fff}
.cbtn.l{background:#fff;color:#1F2328;box-shadow:inset 0 0 0 2px #E2E0DA}
.cbtn+.cbtn{margin-top:10px}

/* done overlay */
.ov{position:fixed;inset:0;z-index:50;background:#0006;display:grid;place-items:center;padding:16px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.ov .box{background:#fff;border-radius:28px;padding:24px 18px;text-align:center;max-width:360px;width:100%;animation:pop .45s var(--ease) both}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ov .box .e{font-size:70px;line-height:1.1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="demo">🧪 דמו לניסיון · שום דבר לא נשמר</div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const V=()=>$('#view');
const S={done:{ex1:false,ex2:false,ex3:false},streak:6,seeds:42,showNotice:true,
  my:[], ex1Level:0, songStuck:{}};
let timers=[];
const clearT=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];try{speechSynthesis.cancel()}catch(e){}};
function toast(t,ms=2400){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),ms)}
function go(r){if(location.hash!=='#'+r)location.hash=r;else render()}
window.addEventListener('hashchange',render);
function back(){history.length>1?history.back():go('home')}
const topbar=(t,tm)=>`<div class="top"><button class="back" onclick="back()" aria-label="חזרה">→</button><h1>${t}</h1>${tm?`<span class="tm">${tm}</span>`:''}</div>`;

/* ===== HOME ===== */
const EX=[['ex1','👂','שמע והפוך לתמונה','4 דקות · לזכור מה אמרו לך'],['ex2','🎯','ציד מילה','4 דקות · להתרכז'],['ex3','📚','ללמוד דבר חדש','4 דקות · אנגלית, שירים']];
let pendingWater=null;
function home(){
  const watered=pendingWater; pendingWater=null;
  const d=S.done, n=Object.values(d).filter(Boolean).length;
  const size=(k,base)=>base+(d[k]?18:0);
  const next=EX.find(e=>!d[e[0]]);
  V().innerHTML=`<div class="scr"><div class="sun"></div>
   <div class="hi">בוקר טוב מוישי ☀️</div>
   <div class="streak"><span class="f">🔥</span>${S.streak+(n===3?1:0)} ימים ברצף</div>
   <div class="garden">
     ${[['ex1','🌷','שמיעה',36],['ex2','🌻','קשב',46],['ex3','🌳','מילים',58]].map(p=>`<div class="pl" data-k="${p[0]}"><div class="drops"></div><span class="p" style="font-size:${size(p[0],p[3])}px">${p[1]}</span>${p[2]}</div>`).join('')}
   </div>
   <div class="tasks">
     <div class="muted">${n===3?'🌻 הגן הושקה היום. נתראה מחר!':'היום: '+n+' מתוך 3 · '+(12-n*4)+' דקות נשארו'}</div>
     ${EX.map(e=>`<button class="tk ${d[e[0]]?'done':''}" onclick="go('${e[0]}')"><span class="e">${e[1]}</span><span class="w"><b>${e[2]}</b><small>${e[3]}</small></span><span class="st">${d[e[0]]?'💧✔':'💧'}</span></button>`).join('')}
     ${next?`<button class="btn" style="margin-top:12px" onclick="go('${next[0]}')">▶ ממשיכים: ${next[2]}</button>`:''}
     <div class="seedsum"><div><b>${S.seeds+S.my.length}</b>זרעים בגן</div><div><b>3</b>להשקות היום</div><div><b>${S.streak}</b>ימים ברצף</div></div>
     <div style="height:70px"></div>
   </div></div>
   <button class="helpbtn" onclick="go('helper')"><span class="mi">🎙️</span>עוזר מיידי</button>`;
  if(watered){const pl=document.querySelector(`.pl[data-k="${watered}"] .drops`);
    if(pl){pl.innerHTML=[10,40,70,25,55].map((x,i)=>`<i style="right:${x}%;animation-delay:${i*.12}s">💧</i>`).join('');}}
}
function finish(k,msg){
  S.done[k]=true; clearT();
  const all=Object.values(S.done).every(Boolean);
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="box"><div class="e">${all?'🌻':'💧'}</div><div class="big" style="margin:6px 0">${all?'כל הגן הושקה היום!':'הצמח הושקה'}</div><p class="muted" style="margin-bottom:14px">${msg}${all?'<br>🔥 הרצף עלה ל־'+(S.streak+1)+' ימים':''}</p><button class="btn">לגן ←</button></div>`;
  document.body.appendChild(o);
  o.querySelector('button').onclick=()=>{o.remove();pendingWater=k;go('home')};
}

/* ===== EX1: hear → pictures ===== */
const IT={cable:['🔌','כבל'],yossi:['📞','להתקשר ליוסי'],pedal:['🦶','דוושה'],keys:['🎹','מקלדת'],mic:['🎤','מיקרופון'],batt:['🔋','סוללות'],water:['💧','מים'],notes:['📄','תווים'],phones:['🎧','אוזניות'],car:['🚗','לתדלק'],bread:['🍞','לחם'],red:['🟥','אדום']};
const R1=[
 {say:'תביא כבל, תתקשר ליוסי, ואל תשכח דוושה.',seq:['cable','yossi','pedal']},
 {say:'קודם תקנה לחם, אחר כך תתדלק, תביא את התווים, ובסוף תתקשר ליוסי.',seq:['bread','car','notes','yossi']},
 {say:'תכניס לתיק אוזניות, סוללות, מיקרופון, מים ואת הדוושה.',seq:['phones','batt','mic','water','pedal']}
];
let heVoice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices();heVoice=v.find(x=>/^he|^iw/i.test(x.lang))||null}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice}catch(e){}
function speak(t,onend){
  try{ if(!('speechSynthesis' in window)) throw 0;
    const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.92;if(heVoice)u.voice=heVoice;
    let ended=false;const fin=()=>{if(!ended){ended=true;onend(true)}};
    u.onend=fin;u.onerror=()=>{if(!ended){ended=true;onend(false)}};
    speechSynthesis.cancel();speechSynthesis.speak(u);
    timers.push(setTimeout(fin,Math.max(4000,t.length*120)));
  }catch(e){onend(false)}
}
function ex1(){
  const L=R1[Math.min(S.ex1Level,R1.length-1)];
  V().innerHTML=`<div class="scr">${topbar('👂 שמע והפוך לתמונה','שלב '+(S.ex1Level+1)+' מתוך 3')}
   <div class="card"><p>הטלפון יגיד הוראה קצרה, פעם אחת. אחר כך היא נעלמת, ואתה בוחר את התמונות <b>לפי הסדר</b>.</p>
   <div class="listen"><div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div><div id="lst" class="muted">מוכן?</div></div>
   <button class="btn b" id="play">🔊 השמע את ההוראה</button></div><div id="pick"></div></div>`;
  $('#play').onclick=()=>{
    $('#play').style.display='none';$('#wave').classList.add('on');$('#lst').textContent='מקשיבים…';

/* --- simple free rules: text → rows --- */
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const NUM={'אחת':1,'אחד':1,'שתיים':2,'שתים':2,'שלוש':3,'ארבע':4,'חמש':5,'שש':6,'שבע':7,'שמונה':8,'תשע':9,'עשר':10,'אחת עשרה':11,'שתים עשרה':12,'שתיים עשרה':12};
const ICON=[[/מקלדת|פסנתר|קלידים/,'🎹'],[/רמקול/,'🔊'],[/מיקרופון/,'🎤'],[/כבל/,'🔌'],[/תווים|דף/,'📄'],[/דוושה/,'🦶'],[/גיטרה/,'🎸'],[/תאורה|אור/,'💡'],[/מים|שתייה/,'💧'],[/ספר|מחברת/,'📒'],[/כסף|תשלום|צ'ק/,'💰']];
const iconFor=t=>{for(const [r,e] of ICON)if(r.test(t))return e;return '📦'};
function parse(txt){
  const t=' '+txt.replace(/\s+/g,' ')+' '; const rows=[];
  // when
  let day=null; for(const d of DAYS){ if(new RegExp('(יום |ב)'+d+'[ ,.]').test(t)){day=d;break} }
  if(!day){ if(/ מחר/.test(t))day='מחר'; else if(/ היום/.test(t))day='היום'; else if(/מוצאי שבת|מוצ"ש/.test(t))day='מוצאי שבת'; }
  let time=null; const m1=t.match(/(\d{1,2})[:.](\d{2})/);
  if(m1)time=m1[1].padStart(2,'0')+':'+m1[2];
  else{ const m2=t.match(/(?:בשעה |ב)(אחת עשרה|שתים עשרה|שתיים עשרה|אחת|שתיים|שתים|שלוש|ארבע|חמש|שש|שבע|שמונה|תשע|עשר)(?:[ ,.])/);
    const m3=t.match(/בשעה (\d{1,2})/);
    let h=m2?NUM[m2[1]]:(m3?+m3[1]:null);
    if(h!=null){ if(/ערב|לילה|אחר הצהריים|אחה"צ/.test(t)&&h<12)h+=12; const half=/וחצי/.test(t); time=String(h).padStart(2,'0')+(half?':30':':00'); } }
  if(day||time)rows.push({i:'🕗',w:(day?(DAYS.includes(day)?'יום '+day:day):'')+(day&&time?', ':'')+(time||''),to:'📅 ליומן',dest:'cal'});
  // where
  const pl=t.match(/ ב(אולם[^,.]*?|בית[^,.]*?|אצל[^,.]*?|רחוב[^,.]*?|גן[^,.]*?|מלון[^,.]*?|ישיבה[^,.]*?|מרכז[^,.]*?)(?=[,.]| תביא| ת| עם| בשעה| ב)/);
  if(pl){let w=pl[1].trim();const ws=w.split(' ');if(ws[1]&&/^ה/.test(ws[1])&&!/^ה/.test(ws[0]))w='ה'+w;rows.push({i:'📍',w})}
  // bring
  const br=t.match(/(?:תביא|להביא|תיקח|לקחת|אל תשכח)(?: את)? ([^.]*?)(?=[.]|,? ות(?!ביא)|$)/);
  if(br){ br[1].split(/,| ו(?=[א-ת])/).map(s=>s.replace(/^(את|ה)\s*/,'').trim()).filter(s=>s&&s.length>1).forEach(s=>{
      const nice=s.replace(/^שני /,'2 ').replace(/^שתי /,'2 ').replace(/^שלושה /,'3 ');
      rows.push({i:iconFor(s),w:nice,to:'🧰 לציוד',dest:'gear'}) }) }
  // calls
  const cl=t.match(/(?:תתקשר|להתקשר|תדבר|לדבר) (?:ל|עם )([^ ,.]+)(?: ([^,.]*))?/);
  if(cl){let more=(cl[2]||'').replace(/(ביום|יום) (ראשון|שני|שלישי|רביעי|חמישי|שישי)|בשבת|מחר|היום/g,'').replace(/\s+/g,' ').trim().replace(/^לגבי /,'· ');
    rows.push({i:'📞',w:'להתקשר ל'+cl[1]+(more?' '+more:''),to:'📅 ליומן',dest:'cal'})}
  // songs
  const sg=t.match(/(?:להתחיל|לפתוח|פותחים|מתחילים)(?: עם| ב)? (השיר[^,.]*)/)||t.match(/(השיר של [^,.]+)/);
  if(sg)rows.push({i:'🎤',w:'פותחים ב'+sg[1].trim().replace(/^השיר/,'שיר'),to:'📋 לליין־אפ',dest:'line'});
  if(!rows.length)rows.push({i:'📝',w:txt.trim().slice(0,80)});
  const title=sg||/הופעה|אירוע|חתונה|בר מצווה/.test(t)?'הופעה'+(day&&DAYS.includes(day)?', יום '+day:''):(day?(DAYS.includes(day)?'יום '+day:day):'מה אמרו לי');
  return {title,rows};
}
function makeCard(txt){
  if(!txt||!txt.trim()){toast('לא נשמע כלום. נסה שוב.');return}
  const c=parse(txt);
  const draw=()=>{ $('#hbody').innerHTML=`<div class="hcard"><div class="t">🎙️ ${c.title}</div>
     ${c.rows.map((r,i)=>`<div class="hrow"><span class="i">${r.i}</span><span class="w" data-i="${i}">${r.w}</span>${r.to?`<button class="to" data-d="${i}">${r.to}</button>`:''}<button class="x" data-x="${i}" aria-label="מחק שורה">✕</button></div>`).join('')}
     <button class="cbtn l" id="add" style="margin-top:10px">＋ להוסיף שורה</button></div>
     <div class="gone">🗑️ הטקסט המלא נמחק. נשאר רק הכרטיס. לוחצים על שורה כדי לתקן אותה.</div>
     <button class="cbtn" id="again" style="margin-top:12px">🎙️ להקשיב שוב</button>`;
    document.querySelectorAll('.hrow .w').forEach(w=>w.onclick=()=>{ if(w.querySelector('input'))return; const i=+w.dataset.i;
      w.innerHTML=`<input value="${c.rows[i].w.replace(/"/g,'&quot;')}">`; const inp=w.querySelector('input'); inp.focus();
      const save=()=>{c.rows[i].w=inp.value.trim()||c.rows[i].w;draw()}; inp.onblur=save; inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()}; });
    document.querySelectorAll('.hrow .x').forEach(b=>b.onclick=()=>{c.rows.splice(+b.dataset.x,1);draw()});
    document.querySelectorAll('.hrow .to').forEach(b=>b.onclick=()=>{const r=c.rows[+b.dataset.d];
      if(r.dest==='cal')toast('📅 בגרסה האמיתית: נכנס ליומן של הטלפון');
      else{ const txt=(r.dest==='gear'?'🧰 לציוד: ':'📋 לליין־אפ: ')+r.w;
        if(navigator.share)navigator.share({text:txt}).catch(()=>{}); else toast(txt+' · נשלח בשיתוף'); } });
    $('#add').onclick=()=>{c.rows.push({i:'📝',w:'שורה חדשה'});draw();const ws=document.querySelectorAll('.hrow .w');ws[ws.length-1].click()};
    $('#again').onclick=()=>helper();
  };
  finalTxt='';interim=''; // the full text is not kept
  draw(); $('#hbody').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ===== router ===== */
function render(){
  clearT(); if(listening)stopListen(); document.body.style.background='';
  const r=(location.hash||'#home').slice(1);
  ({home:()=>home(),ex1,ex2,ex3,helper}[r]||home)(); scrollTo(0,0);
}
render();
</script>
